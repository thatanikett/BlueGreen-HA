version: 0.0
os: linux
files:
  - source: /
    destination: /opt/bluegreen-backend
hooks:
  BeforeInstall:
    - location: backend/scripts/before_install.sh
      timeout: 300
      runas: root
  AfterInstall:
    - location: backend/scripts/migrate_db.sh
      timeout: 300
      runas: root
  ApplicationStop:
    - location: backend/scripts/stop_server.sh
      timeout: 300
      runas: root
  ApplicationStart:
    - location: backend/scripts/start_server.sh
      timeout: 300
      runas: root
